services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_NAME:-order_db}"
      POSTGRES_USER: "${DB_USER:-order_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-order_pass}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices-net

  order-service:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-django-insecure-twoj-tymczasowy-klucz-dla-dev}"
      DB_HOST: "${DB_HOST:-order-db}"
      DB_NAME: "${DB_NAME:-order_db}"
      DB_USER: "${DB_USER:-order_user}"
      DB_PASSWORD: "${DB_PASSWORD:-order_pass}"
      DB_PORT: "${DB_PORT:-5432}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}"
      PAYU_BASE_URL: "${PAYU_BASE_URL:-https://secure.snd.payu.com}"
      PAYU_POS_ID: "${PAYU_POS_ID:-}"
      PAYU_CLIENT_ID: "${PAYU_CLIENT_ID:-}"
      PAYU_CLIENT_SECRET: "${PAYU_CLIENT_SECRET:-}"
      PAYU_SECOND_KEY: "${PAYU_SECOND_KEY:-}"
      PAYU_CONTINUE_URL: "${PAYU_CONTINUE_URL:-http://localhost:8003/api/docs/}"
      PAYU_NOTIFY_URL: "${PAYU_NOTIFY_URL:-http://localhost:8003/api/orders/payu-webhook/}"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - microservices-net

  order-consumer:
    build: .
    command: python manage.py start_consumer
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      SECRET_KEY: "${SECRET_KEY:-django-insecure-twoj-tymczasowy-klucz-dla-dev}"
      DB_HOST: "${DB_HOST:-order-db}"
      DB_NAME: "${DB_NAME:-order_db}"
      DB_USER: "${DB_USER:-order_user}"
      DB_PASSWORD: "${DB_PASSWORD:-order_pass}"
      DB_PORT: "${DB_PORT:-5432}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/%2F}"
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - microservices-net

volumes:
  postgres_data:

networks:
  microservices-net:
    external: true
