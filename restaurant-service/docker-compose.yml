services:
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - restaurant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - restaurant-db

  restaurant-service:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "true"
      JWT_SIGNING_KEY: "django-insecure-twoj-tymczasowy-klucz-dla-dev"
      POSTGRES_HOST: restaurant-db
      POSTGRES_PORT: 5432
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - microservices-net

  restaurant-consumer:
    build: .
    command: python manage.py start_consumer
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "true"
      JWT_SIGNING_KEY: "django-insecure-twoj-tymczasowy-klucz-dla-dev"
      POSTGRES_HOST: restaurant-db
      POSTGRES_PORT: 5432
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - microservices-net

volumes:
  restaurant-db-data:

networks:
  microservices-net:
    external: true
